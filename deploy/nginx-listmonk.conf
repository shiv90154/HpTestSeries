# /etc/nginx/sites-available/listmonk
# First install: add a DNS A record  lists → <VPS IP>, enable this file as is (port-80 block only), then run
#   certbot --nginx -d lists.hptestseries.in
# certbot adds the 443 block and the http → https redirect itself.

server {
    listen 80;
    listen [::]:80;
    server_name lists.hptestseries.in;
    server_tokens off;

    # CSV subscriber imports and campaign media uploads.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
