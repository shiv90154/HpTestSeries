# /etc/nginx/sites-available/rjtestseries
# Same app as hptestseries.in (port 3030): src/proxy.ts picks the site from the Host header.
# The catch-all default_server blocks live in nginx.conf (hptestseries); don't repeat them here.
# First install (no certificate yet): use only the port-80 block with proxy_pass, run
#   certbot --nginx -d rjtestseries.in -d www.rjtestseries.in
# then replace the file with this one. Canonical host is https://rjtestseries.in.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rjtestseries.in;

    ssl_certificate /etc/letsencrypt/live/rjtestseries.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rjtestseries.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.rjtestseries.in;

    ssl_certificate /etc/letsencrypt/live/rjtestseries.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rjtestseries.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;

    return 301 https://rjtestseries.in$request_uri;
}

# http → https apex
server {
    listen 80;
    listen [::]:80;
    server_name rjtestseries.in www.rjtestseries.in;
    server_tokens off;
    return 301 https://rjtestseries.in$request_uri;
}
