# /etc/nginx/sites-available/hptestseries
# First install (no certificate yet): use only the port-80 block with proxy_pass, run
#   certbot --nginx -d hptestseries.in -d www.hptestseries.in
# then replace the file with this one. Canonical host is https://hptestseries.in.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hptestseries.in;

    ssl_certificate /etc/letsencrypt/live/hptestseries.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hptestseries.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;

    # Question CSV imports go through a 4 MB server action.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        # Security headers come from the app (next.config.ts); nginx only hides stack details.
        proxy_hide_header X-Powered-By;
    }
}

# www → apex (one canonical address for users and search engines)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.hptestseries.in;

    ssl_certificate /etc/letsencrypt/live/hptestseries.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hptestseries.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;

    return 301 https://hptestseries.in$request_uri;
}

# http → https apex
server {
    listen 80;
    listen [::]:80;
    server_name hptestseries.in www.hptestseries.in;
    server_tokens off;
    return 301 https://hptestseries.in$request_uri;
}
